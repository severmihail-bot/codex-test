name: Validate knowledge library

on:
  pull_request:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate metadata registry
        run: python scripts/validate_metadata.py

      - name: Validate knowledge library
        run: python scripts/validate_knowledge.py
